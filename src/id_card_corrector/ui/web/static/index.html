<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Esquinas - Imprenta</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Barra superior: Instrucciones -->
        <header id="instruction-bar" class="instruction-bar">
            Cargando...
        </header>

        <!-- Área central: Imagen y Canvas -->
        <main class="canvas-container">
            <canvas id="main-canvas"></canvas>
        </main>

        <!-- Barra inferior: Controles -->
        <footer class="controls-bar">
            <button id="btn-restart" class="btn btn-secondary" disabled>Reiniciar (R)</button>
            <button id="btn-cancel" class="btn btn-danger" disabled>Cancelar (ESC)</button>
            <button id="btn-confirm" class="btn btn-primary" disabled>Confirmar (ENTER)</button>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
