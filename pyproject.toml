[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "id-card-corrector"
version = "0.1.0"
description = "Straightens ID card photos and generates a print-ready PDF."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "JavierVizGarriDev", email = "javieralejandrovizcainogarriga@gmail.com" },
]
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",
]

[project.scripts]
id-card-corrector = "id_card_corrector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]